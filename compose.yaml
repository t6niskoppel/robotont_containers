services:
  ros:
    # Display settings per host OS, chosen by HOST_OS in .env. See platform/.
    extends:
      file: platform/${HOST_OS:?set HOST_OS in .env to linux, windows or mac}.yaml
      service: display
    # ROS version: ROS_DISTRO in .env or the shell, default jazzy.
    image: t6niskoppel/robotont-dev:${ROS_DISTRO:-jazzy}
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    network_mode: host
    ipc: host
    # Keep bash alive when started via `docker compose run`/`up`.
    stdin_open: true
    tty: true
    # The image's 'ubuntu' user is uid 1000, same as you, so X11 lets it in.
    user: ubuntu
    # The colcon workspace, on the host so edits and git branches survive the container.
    working_dir: /ws
    volumes:
      - ./ws:/ws
      - ./repos:/repos:ro
    environment:
      # X shared memory doesn't cross the VM boundary on Windows/macOS, which leaves Qt
      # windows (rviz2) blank. Qt disables it whenever this is set, whatever the value.
      QT_X11_NO_MITSHM: "1"
